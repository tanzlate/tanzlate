# pnpm-workspace.yaml

packages:
  - packages/**
  - docs
  - examples/**
allowBuilds:
  '@parcel/watcher': true
  esbuild: true

# Several transitive deps pull their own Vue (@use-compose/ui, vitepress-plugin-mermaid).
# Combined with shamefully-hoist that puts multiple Vue copies in scope, and reactivity does
# not cross a copy boundary -- refs stop tracking. Pin one.
overrides:
  vue: 3.5.33
