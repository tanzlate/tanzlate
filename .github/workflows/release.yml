name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      # `corepack enable` with no argument also shims `npm`, which would shadow the
      # npm upgrade below. Only shim pnpm.
      - name: Enable Corepack (pnpm only)
        run: corepack enable pnpm

      # npm OIDC trusted publishing requires npm >= 11.5.1. setup-node ships npm 10.x,
      # which has no trusted-publishing support, so the publish goes out unauthenticated
      # and npm answers E404 (it masks 403 as 404 for existing packages).
      - name: Toolchain for OIDC trusted publishing
        run: |
          corepack prepare pnpm@10 --activate
          npm install -g npm@latest
          npm --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      - name: Push tags
        if: ${{ steps.changesets.outputs.published == 'true' }}
        run: git push --follow-tags
